<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - Food Store</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: #f7eae0;
        color: #5e3122;
      }

      header {
        background-color: #1d4533;
        color: #f7eae0;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header nav a {
        color: #f9d2ba;
        text-decoration: none;
        margin-left: 20px;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color 0.2s;
      }
      header nav a:hover {
        color: white;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        gap: 30px;
        align-items: flex-start;
      }

      .cart-items-section {
        flex: 2;
      }
      .page-title {
        font-size: 1.8rem;
        color: #1d4533;
        margin-bottom: 20px;
        font-weight: 800;
      }

      #cart-items-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .cart-item {
        background: white;
        border-radius: 12px;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 10px rgba(29, 69, 51, 0.05);
        gap: 20px;
        border: 1px solid rgba(249, 210, 186, 0.3);
      }
      .cart-item img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
      }
      .item-info {
        flex: 1;
      }
      .item-info h3 {
        font-size: 1.1rem;
        color: #1d4533;
        margin-bottom: 3px;
      }
      .item-category {
        font-size: 0.75rem;
        color: #a88a7c;
        text-transform: uppercase;
      }
      .item-subtotal {
        font-size: 0.95rem;
        color: #5e3122;
        margin-top: 5px;
      }

      .quantity-controls {
        display: flex;
        align-items: center;
        background: #f7eae0;
        border-radius: 8px;
        overflow: hidden;
      }
      .qty-btn {
        background: transparent;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        color: #1d4533;
        font-weight: bold;
        transition: background 0.2s;
      }
      .qty-btn:hover {
        background: #f9d2ba;
      }
      .qty-value {
        padding: 0 10px;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .remove-btn {
        background: transparent;
        border: none;
        color: #a88a7c;
        cursor: pointer;
        font-size: 0.85rem;
        text-decoration: underline;
        margin-top: 10px;
        display: block;
        text-align: right;
      }
      .remove-btn:hover {
        color: #d9534f;
      }

      .cart-summary-section {
        flex: 1;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(29, 69, 51, 0.08);
        border: 1px solid rgba(249, 210, 186, 0.5);
        position: sticky;
        top: 20px;
        margin-top: 54px;
      }
      .cart-summary-section h3 {
        font-size: 1.3rem;
        color: #1d4533;
        margin-bottom: 20px;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        font-size: 1rem;
        color: #5e3122;
      }
      .summary-row.total-row {
        font-size: 1.4rem;
        font-weight: 800;
        color: #1d4533;
        border-top: 2px solid #f7eae0;
        padding-top: 15px;
        margin-top: 15px;
        margin-bottom: 20px;
      }

      .payment-group {
        margin-bottom: 20px;
      }
      .payment-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1d4533;
        margin-bottom: 6px;
      }
      .payment-group select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(29, 69, 51, 0.25);
        background-color: #f7eae0;
        color: #1d4533;
        font-size: 0.95rem;
        font-weight: 500;
        outline: none;
      }

      .checkout-btn {
        width: 100%;
        background-color: #1d4533;
        color: #f7eae0;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 12px;
        transition: background 0.2s;
      }
      .checkout-btn:hover:not(:disabled) {
        background-color: #285e46;
      }
      .checkout-btn:disabled {
        background-color: #a88a7c;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .clear-btn {
        width: 100%;
        background-color: transparent;
        color: #d9534f;
        border: 1px solid #d9534f;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .clear-btn:hover {
        background-color: #d9534f;
        color: white;
      }

      #empty-cart-msg {
        padding: 40px;
        text-align: center;
        color: #a88a7c;
        background: white;
        border-radius: 12px;
        border: 1px dashed rgba(249, 210, 186, 0.8);
      }

      header nav a.logout-link {
        color: #f9d2ba;
        opacity: 0.8;
        margin-left: 30px;
        border-left: 1px solid rgba(249, 210, 186, 0.3);
        padding-left: 20px;
      }
      header nav a.logout-link:hover {
        color: #d9534f;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛒 FoodStore</h1>
      <nav>
        <a href="../home/home.html">Catálogo</a>
        <a href="#" id="logout-btn" class="logout-link">Cerrar sesión</a>
      </nav>
    </header>

    <main>
      <section class="cart-items-section">
        <h2 class="page-title">Mi Carrito</h2>
        <div id="cart-items-container"></div>
        <p id="empty-cart-msg" style="display: none">Tu carrito está vacío.</p>
      </section>

      <section class="cart-summary-section">
        <h3>Resumen</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          $<span id="summary-subtotal">0</span>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          $<span id="summary-total">0</span>
        </div>

        <div class="payment-group">
          <label for="forma-pago">Forma de Pago</label>
          <select id="forma-pago">
            <option value="EFECTIVO">Efectivo</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="TRANSFERENCIA">Transferencia</option>
          </select>
        </div>

        <button id="checkout-btn" class="checkout-btn">Finalizar compra</button>
        <button id="clear-cart-btn" class="clear-btn">Vaciar carrito</button>
      </section>
    </main>

    <script type="module" src="./cart.ts"></script>
  </body>
</html>
