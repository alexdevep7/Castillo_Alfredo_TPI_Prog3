<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo - Food Store</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: #f7eae0;
        color: #5e3122;
      }

      /* Cabecera */
      header {
        background-color: #1d4533;
        color: #f7eae0;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header nav a {
        color: #f9d2ba;
        text-decoration: none;
        margin-left: 20px;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color 0.2s;
      }
      header nav a:hover {
        color: white;
      }

      /* Layout Principal */
      main {
        display: flex;
        max-width: 1300px;
        margin: 0 auto;
        padding: 30px 20px;
        gap: 40px;
      }

      /* Menú Lateral */
      aside {
        width: 200px;
        flex-shrink: 0;
      }
      aside h2 {
        font-size: 0.8rem;
        color: #5e3122;
        text-transform: uppercase;
        margin-bottom: 15px;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .category-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 15px;
        margin-bottom: 5px;
        border-radius: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 0.95rem;
        color: #5e3122;
        transition: all 0.2s;
      }
      .category-btn:hover {
        background-color: #f9d2ba;
        color: #5e3122;
      }
      .category-btn.active {
        background-color: #1d4533;
        color: #f7eae0;
        font-weight: 500;
      }

      /* Contenedor Derecho */
      section {
        flex: 1;
      }
      .search-container input {
        width: 100%;
        padding: 15px 25px;
        border-radius: 30px;
        border: 1px solid #f9d2ba;
        outline: none;
        font-size: 1rem;
        margin-bottom: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        color: #5e3122;
        background-color: white;
      }
      .search-container input::placeholder {
        color: #a88a7c;
      }

      /* Grilla de Productos */
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 25px;
      }

      /* Tarjeta de Producto */
      .product-card {
        background: white;
        border-radius: 16px;
        padding: 25px 20px;
        box-shadow: 0 4px 15px rgba(29, 69, 51, 0.08);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(249, 210, 186, 0.3);
      }
      .product-card img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 20px auto;
        display: block;
        box-shadow: 0 4px 10px rgba(94, 49, 34, 0.15);
      }
      .product-category {
        font-size: 0.7rem;
        color: #5e3122;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 5px;
        letter-spacing: 0.5px;
        opacity: 0.8;
      }
      .product-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        color: #1d4533;
        line-height: 1.3;
      }
      .product-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #f7eae0;
        padding-top: 15px;
      }
      .product-price {
        font-weight: 700;
        font-size: 1.1rem;
        color: #5e3122;
      }
      .add-btn {
        background-color: #1d4533;
        color: #f7eae0;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        transition: background 0.2s;
      }
      .add-btn:hover {
        background-color: #5e3122;
        color: #f7eae0;
      }
      /* Badge del Carrito */
      .cart-badge {
        background-color: #f9d2ba;
        color: #5e3122;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        margin-left: 5px;
        vertical-align: middle;
      }

      header nav a.logout-link {
        color: #f9d2ba;
        opacity: 0.8;
        margin-left: 30px;
        border-left: 1px solid rgba(249, 210, 186, 0.3);
        padding-left: 20px;
      }
      header nav a.logout-link:hover {
        color: #d9534f;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛒 FoodStore</h1>
      <nav>
        <a href="#">Catálogo</a>
        <a href="../cart/cart.html"
          >Carrito <span id="cart-count" class="cart-badge">0</span></a
        >
        <a href="#" id="logout-btn" class="logout-link">Cerrar sesión</a>
      </nav>
    </header>

    <main>
      <aside>
        <h2>Categorías</h2>
        <div id="category-container">
          <!-- Render dinámico -->
        </div>
      </aside>

      <section>
        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="🔍 Buscar productos..."
          />
        </div>

        <div id="products-container" class="products-grid">
          <!-- Render dinámico -->
        </div>
        <p
          id="no-results-msg"
          style="display: none; color: #d97706; font-weight: 500"
        >
          No se encontraron productos coincidentes.
        </p>
      </section>
    </main>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
