<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin | Food Store</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: #f7eae0;
        color: #5e3122;
      }

      header {
        background-color: #1d4533;
        color: #f7eae0;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #admin-name {
        font-size: 0.9rem;
        color: #f9d2ba;
      }
      .logout-btn {
        background: transparent;
        border: 1px solid #f9d2ba;
        color: #f9d2ba;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .logout-btn:hover {
        background-color: #d9534f;
        border-color: #d9534f;
        color: white;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 20px;
      }

      /* Navegación por pestañas */
      .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
        border-bottom: 2px solid rgba(29, 69, 51, 0.15);
        padding-bottom: 12px;
      }
      .tab-btn {
        background: white;
        color: #1d4533;
        border: 1px solid rgba(29, 69, 51, 0.2);
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: #1d4533;
        color: #f7eae0;
        border-color: #1d4533;
      }

      .tab-section {
        display: none;
      }
      .tab-section.active {
        display: block;
      }

      /* Tarjetas y Formularios */
      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(29, 69, 51, 0.06);
        border: 1px solid rgba(249, 210, 186, 0.5);
        margin-bottom: 25px;
      }
      .card h2 {
        color: #1d4533;
        font-size: 1.3rem;
        margin-bottom: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
        margin-bottom: 15px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #1d4533;
      }
      .form-group input,
      .form-group select {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(29, 69, 51, 0.25);
        font-size: 0.95rem;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: #1d4533;
      }
      .checkbox-group {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding-top: 24px;
      }
      .checkbox-group input {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .btn-primary {
        background-color: #1d4533;
        color: #f7eae0;
        border: none;
        padding: 11px 20px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #285e46;
      }
      .btn-secondary {
        background-color: #a88a7c;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }

      /* Tablas */
      .table-wrapper {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #f7eae0;
        font-size: 0.9rem;
      }
      th {
        background-color: #f7eae0;
        color: #1d4533;
        font-weight: 700;
      }
      td img {
        width: 45px;
        height: 45px;
        border-radius: 8px;
        object-fit: cover;
      }

      .badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .badge-ok {
        background-color: #d1fae5;
        color: #065f46;
      }
      .badge-no {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .action-btn {
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        margin-right: 5px;
      }
      .edit-btn {
        background-color: #f9d2ba;
        color: #1d4533;
      }
      .delete-btn {
        background-color: #fee2e2;
        color: #b91c1c;
      }
      .status-select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #1d4533;
        font-weight: 600;
        color: #1d4533;
        background-color: #f7eae0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🛠️ FoodStore | Panel Administrativo</h1>
      <div class="header-right">
        <span id="admin-name"></span>
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="pedidos">📋 Pedidos</button>
        <button class="tab-btn" data-tab="productos">🍔 Productos</button>
        <button class="tab-btn" data-tab="categorias">🏷️ Categorías</button>
      </div>

      <!-- SECCIÓN PEDIDOS -->
      <section id="tab-pedidos" class="tab-section active">
        <div class="card">
          <h2>Gestión de Pedidos</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Fecha</th>
                  <th>Cliente</th>
                  <th>Detalle</th>
                  <th>Pago</th>
                  <th>Total</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="pedidos-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SECCIÓN PRODUCTOS -->
      <section id="tab-productos" class="tab-section">
        <div class="card">
          <h2 id="prod-form-title">Nuevo Producto</h2>
          <form id="form-producto">
            <input type="hidden" id="prod-id" />
            <div class="form-grid">
              <div class="form-group">
                <label for="prod-nombre">Nombre</label>
                <input type="text" id="prod-nombre" required />
              </div>
              <div class="form-group">
                <label for="prod-categoria">Categoría</label>
                <select id="prod-categoria" required></select>
              </div>
              <div class="form-group">
                <label for="prod-precio">Precio ($)</label>
                <input
                  type="number"
                  id="prod-precio"
                  min="1"
                  step="0.01"
                  required
                />
              </div>
              <div class="form-group">
                <label for="prod-stock">Stock</label>
                <input type="number" id="prod-stock" min="0" required />
              </div>
              <div class="form-group">
                <label for="prod-imagen">URL de Imagen</label>
                <input
                  type="url"
                  id="prod-imagen"
                  placeholder="https://..."
                  required
                />
              </div>
              <div class="form-group">
                <label for="prod-descripcion">Descripción</label>
                <input type="text" id="prod-descripcion" />
              </div>
              <div class="form-group checkbox-group">
                <input type="checkbox" id="prod-disponible" checked />
                <label for="prod-disponible">Disponible para la venta</label>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">
                Guardar Producto
              </button>
              <button
                type="button"
                id="prod-cancel-btn"
                class="btn-secondary"
                style="display: none"
              >
                Cancelar edición
              </button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2>Listado de Productos</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Imagen</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="productos-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SECCIÓN CATEGORÍAS -->
      <section id="tab-categorias" class="tab-section">
        <div class="card">
          <h2 id="cat-form-title">Nueva Categoría</h2>
          <form id="form-categoria">
            <input type="hidden" id="cat-id" />
            <div class="form-grid">
              <div class="form-group">
                <label for="cat-nombre">Nombre</label>
                <input type="text" id="cat-nombre" required />
              </div>
              <div class="form-group">
                <label for="cat-descripcion">Descripción</label>
                <input type="text" id="cat-descripcion" />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">
                Guardar Categoría
              </button>
              <button
                type="button"
                id="cat-cancel-btn"
                class="btn-secondary"
                style="display: none"
              >
                Cancelar edición
              </button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2>Listado de Categorías</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="categorias-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
